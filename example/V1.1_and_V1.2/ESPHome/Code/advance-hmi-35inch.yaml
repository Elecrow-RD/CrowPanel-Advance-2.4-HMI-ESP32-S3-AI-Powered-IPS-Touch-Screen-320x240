# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: advance-hmi-35inch
  friendly_name: Advance-HMI-3.5inch
  platformio_options:
      build_flags: "-DBOARD_HAS_PSRAM"
      board_build.esp-idf.memory_type: qio_opi
      board_build.flash_mode: dio
      
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz 
  
logger:

api:
  encryption:
    key: "GSsIhUq9HrxqBrzDfvjmlcWLpRu75iG3w4LqanZfjpc="

ota:
  - platform: esphome
    password: "f248da2e7cf3058a690bc9127653a2c4"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Advance-HMI-3.5 Fallback Hotspot
    password: "2hsJfok4LhaV"

captive_portal:

switch:
  - platform: gpio
    pin: GPIO18
    name: "LED"
    id: led_output
    on_turn_on:
      # Switch bulb diagram
      - lvgl.image.update:
          id: lvgl_light
          src: light_on
      # Switch the status label text to ON
      - lvgl.label.update:
          id: label_light_state
          text: "ON"
    on_turn_off:
      # Switch bulb diagram
      - lvgl.image.update:
          id: lvgl_light
          src: light_off
      # Switch the status label text to OFF
      - lvgl.label.update:
          id: label_light_state
          text: "OFF"

output:
  - platform: ledc
    pin: GPIO38
    inverted: False
    id: backlight_pwm

# Define a monochromatic, dimmable light for the backlight
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_orange
    red: 100%
    green: 50%
    blue: 0%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_teal
    red: 0%
    green: 100%
    blue: 100%
  - id: my_gray
    red: 70%
    green: 70%
    blue: 70%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%

image:
  - file: "small_hum.png"
    id: small_hum
    resize: 50x75
    type: RGB565
  - file: "small_logo.png"
    id: small_logo
    resize: 250x52
    type: RGB565
  - file: "small_temp.png"
    id: small_temp
    resize: 50x75
    type: RGB565
  - file: "light.png"
    id: light_on
    resize: 60x60
    type: RGB565
  - file: "no_light.png"
    id: light_off
    resize: 60x60
    type: RGB565

i2c:
  sda: 15
  scl: 16
  scan: true

sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      name: "Room Temperature"
      id: room_temp
      unit_of_measurement: "°C"
      accuracy_decimals: 1
    humidity:
      name: "Room Humidity"
      id: room_hum
      unit_of_measurement: "%"
      accuracy_decimals: 1
    update_interval: 1s

spi:
  clk_pin: 42
  mosi_pin: 39
  interface: hardware
  id: spiwd

display:
  - platform: ili9xxx
    id: lcd_display
    auto_clear_enabled: false
    model: ILI9488_A
    spi_id: spiwd
    data_rate: 20MHz
    cs_pin: GPIO40
    dc_pin: GPIO41
    
    spi_mode: mode0   #since no cs pin default is mode0
    dimensions: 
      height: 320
      width: 480
    invert_colors: True 

lvgl:
  rotation: 180
  log_level: INFO
  color_depth: 16
  bg_color: 0xFFFFFF
  text_font: montserrat_16
  widgets:
    - image:
        id: lvgl_logo
        src: small_logo
        x: 125
        y: 10
    - image:
        id: lvgl_temp
        src: small_temp
        x: 70
        y: 170
    - image:
        id: lvgl_hum
        src: small_hum
        x: 230
        y: 170
    - image:
        id: lvgl_light
        src: light_off    # Default 'Turn off lights' image
        x: 390            # You can adjust the position by yourself
        y: 170

    - label:
        id: label_temp
        x: 40
        y: 250
        text: "Temp: --°C"
    - label:
        id: label_hum
        x: 200
        y: 250
        text: "Humi: --%"
    - label:
        id: label_light_state
        x: 400
        y: 250
        text: "OFF"

interval:
  - interval: 1s
    then:
      - lambda: |-
          char temp_str[20];
          char hum_str[20];
          snprintf(temp_str, sizeof(temp_str), "Temp: %.1f°C", id(room_temp).state);
          snprintf(hum_str, sizeof(hum_str), "Humi: %.1f%%", id(room_hum).state);
          lv_label_set_text(id(label_temp), temp_str);
          lv_label_set_text(id(label_hum), hum_str);
 